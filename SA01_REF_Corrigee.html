async function fetchBAN(c, marker) {
    if(c.banInfo) return; 
    const q = encodeURIComponent(c.adresse + ' ' + c.cp + ' ' + c.ville);
    const url = `https://api-adresse.data.gouv.fr/search/?q=${q}&lat=${c.lat}&lon=${c.lon}&limit=1`;
    try {
        const res = await fetch(url); const data = await res.json();
        let htmlRes = '', colorRes = '#e74c3c';
        if(data.features && data.features.length > 0) {
            const best = data.features[0]; const score = best.properties.score; let text = 'Faible';
            if(score > 0.8) { colorRes = '#27ae60'; text = 'Excellent'; } else if(score > 0.5) { colorRes = '#f39c12'; text = 'Moyen'; }
            htmlRes = `<strong>BAN Score: ${Math.round(score*100)}% (${text})</strong><br>Ref: ${best.properties.label}`;
        } else { htmlRes = '<span style="color:red">Adresse non trouvée</span>'; }
        c.banInfo = { html: htmlRes, color: colorRes }; marker.setPopupContent(createPopupHTML(c));
    } catch(err) { c.banInfo = { html: '<span style="color:red">Erreur Service BAN</span>', color: 'red' }; marker.setPopupContent(createPopupHTML(c)); }
}

        csvContent += row + "\n";

                div.innerHTML = `${dragHtml}<div class="client-content"><div class="qty-badge" style="background:${col}">${tq}</div><div class="client-name"><span class="order-num">${count}.</span>${c.nom}</div><div class="client-info">${c.adresse}<br>${c.cp} ${c.ville}</div>${complHtml}<div class="mt-2 pt-2 border-top">${htmlP}</div></div>`;
                div.onclick = (e) => { if(e.target.classList.contains('select-cb') || e.target.classList.contains('drag-grip')) return; select(c.id, 'list'); };
                cont.appendChild(div);
                if (c.lat !== 0 && c.lon !== 0) {
                    originalCoords[c.id] = [c.lat, c.lon];
                    const iconHtml = `<div class="map-marker-content" style="background-color:${col};">${count}</div>`;
                    const customIcon = L.divIcon({ html: iconHtml, className: 'custom-map-marker', iconSize: [30, 30], iconAnchor: [15, 15] });
                    const m = L.marker([c.lat, c.lon], { icon: customIcon }).addTo(markerLayerGroup); 
                    m.markerInfo = { count: count, color: col }; m.clientData = c; 
                    m.bindPopup(createPopupHTML(c), { offset: [0, -20] }); 
                    m.on('popupopen', () => { fetchBAN(c, m); });
                    m.bindTooltip(`<b>${c.nom}</b> (#${count})`, { direction: 'top', offset: [0, -15], opacity: 0.9 });

            sortableInstance = new Sortable(cont, { handle: '.drag-grip', animation: 150, ghostClass: 'sortable-ghost', dragClass: 'sortable-drag', onEnd: function (evt) { handleDrop(evt.item.getAttribute('data-id'), evt.oldIndex, evt.newIndex); } });

}
function toggleSelection(id) { if(selectedForDrag.has(id)) selectedForDrag.delete(id); else selectedForDrag.add(id); }
function handleDrop(draggedId, oldIndex, newIndex) {
    let idsToMove = []; if(selectedForDrag.has(draggedId)) { idsToMove = clients.filter(c => selectedForDrag.has(String(c.id))).map(c => c.id); } else { idsToMove = [draggedId]; }
    const itemsToMoveObjects = [];
    for (let i = clients.length - 1; i >= 0; i--) { if (idsToMove.includes(String(clients[i].id)) || idsToMove.includes(clients[i].id)) { itemsToMoveObjects.unshift(clients[i]); clients.splice(i, 1); } }
    let target = newIndex; if(target > clients.length) target = clients.length; if(target < 0) target = 0;
    clients.splice(target, 0, ...itemsToMoveObjects); refreshView();
}
function calcDist(lat1, lon1, lat2, lon2) { if(!lat1 || !lat2) return 0; const R = 6371; const dLat = (lat2-lat1)*Math.PI/180; const dLon = (lon2-lon1)*Math.PI/180; const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2); return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); }
function analyzeRoute() {
    const m = document.getElementById('opti-modal'); const l = document.getElementById('opti-list'); m.style.display='flex'; l.innerHTML = '<div class="text-center p-3"><i class="fas fa-spinner fa-spin fa-2x"></i><br>Analyse approfondie en cours...</div>';
    setTimeout(() => {
        let simulationList = clients.filter(c => c.lat !== 0 && c.lon !== 0);
        if(simulationList.length < 4) { l.innerHTML = '<div class="p-3 text-center">Pas assez de points pour analyser.</div>'; return; }
        const suggestions = []; const thresholdKm = 0.4; 
        const getInsertionCost = (prev, p, next) => { const distAP = calcDist(prev.lat, prev.lon, p.lat, p.lon); const distPB = calcDist(p.lat, p.lon, next.lat, next.lon); const distAB = calcDist(prev.lat, prev.lon, next.lat, next.lon); return (distAP + distPB) - distAB; };
        for(let i=1; i<simulationList.length-1; i++) {
            const p = simulationList[i]; const prev = simulationList[i-1]; const next = simulationList[i+1];
            const currentCost = (calcDist(prev.lat, prev.lon, p.lat, p.lon) + calcDist(p.lat, p.lon, next.lat, next.lon)) - calcDist(prev.lat, prev.lon, next.lat, next.lon);
            let bestGain = 0; let bestTargetIdx = -1;
            for(let j=1; j<simulationList.length; j++) {
                if(j === i || j === i+1) continue;
                const potentialPrev = simulationList[j-1]; const potentialNext = simulationList[j];
                const costElsewhere = getInsertionCost(potentialPrev, p, potentialNext); const gain = currentCost - costElsewhere;
                if(gain > thresholdKm && gain > bestGain) { bestGain = gain; bestTargetIdx = j; }
            }
            if(bestTargetIdx !== -1) { const exists = suggestions.find(s => s.client.id === p.id); if(!exists) { suggestions.push({ client: p, currentPrev: prev, currentNext: next, newPrev: simulationList[bestTargetIdx-1], toIdx: bestTargetIdx, gain: bestGain, nearName: simulationList[bestTargetIdx-1].nom }); } }
        }
        l.innerHTML = '';
        if(suggestions.length === 0) { l.innerHTML = '<div class="p-3 text-center text-success"><i class="fas fa-check-circle fa-3x mb-3"></i><br>Aucune anomalie flagrante (> 400m).</div>'; } 
        else {
            suggestions.sort((a,b) => b.gain - a.gain);
            suggestions.slice(0, 20).forEach(s => {
                const div = document.createElement('div'); div.className = 'opti-item bg-white';
                div.onclick = (e) => { if(e.target.tagName === 'BUTTON') return; document.querySelectorAll('.opti-item').forEach(el => el.classList.remove('selected')); div.classList.add('selected'); previewFix(s.client, s.currentPrev, s.currentNext, s.newPrev); };
                div.innerHTML = `<div class="d-flex justify-content-between align-items-center"><div style="flex:1"><strong><i class="fas fa-eye text-muted me-1"></i> ${s.client.nom}</strong><br><small class="text-danger"><i class="fas fa-long-arrow-alt-right"></i> Actuel: entre ${s.currentPrev.nom.substring(0,10)}... et ${s.currentNext.nom.substring(0,10)}...</small><br><small class="text-success"><i class="fas fa-check"></i> <strong>Proposé: après ${s.nearName}</strong></small></div><div class="text-end ms-2"><div class="opti-gain text-nowrap">-${s.gain.toFixed(1)} km</div><button class="btn btn-sm btn-success mt-1" onclick="applyMove('${s.client.id}', ${getRealIndex(s.toIdx, simulationList)})">Corriger</button></div></div>`;
                l.appendChild(div);
            });
        }
    }, 100);
}
function previewFix(client, currPrev, currNext, newPrev) {
    previewLayer.clearLayers(); 
    const badLine = L.polyline([[currPrev.lat, currPrev.lon], [client.lat, client.lon], [currNext.lat, currNext.lon]], { color: 'red', weight: 4, opacity: 0.7, dashArray: '5, 10' }).addTo(previewLayer);
    const goodLine = L.polyline([[newPrev.lat, newPrev.lon], [client.lat, client.lon]], { color: '#27ae60', weight: 5, opacity: 0.9, dashArray: '10, 10' }).addTo(previewLayer);
    const redPulseIcon = L.divIcon({ className: 'custom-pulse-wrapper', html: '<div class="pulse-red"></div>', iconSize: [0, 0], iconAnchor: [0, 0] });
    L.marker([client.lat, client.lon], { icon: redPulseIcon, zIndexOffset: -1000 }).addTo(previewLayer);
    const group = L.featureGroup([badLine, goodLine]); map.flyToBounds(group.getBounds(), { padding: [50, 50], duration: 0.8 });
}
function getRealIndex(simIndex, simList) { if(simIndex === 0) return 0; const neighborObj = simList[simIndex-1]; const realNeighborIdx = clients.findIndex(c => c.id === neighborObj.id); return realNeighborIdx + 1; }
function applyMove(clientId, insertIndex) {
    const oldIndex = clients.findIndex(c => c.id == clientId); if(oldIndex === -1) return;
    const [movedClient] = clients.splice(oldIndex, 1);
    let targetIdx = insertIndex; if (targetIdx > oldIndex) targetIdx--; if(targetIdx < 0) targetIdx = 0; if(targetIdx > clients.length) targetIdx = clients.length;
    clients.splice(targetIdx, 0, movedClient); closeOpti(); refreshView(); setTimeout(() => { select(clientId, 'list'); alert("Client déplacé !"); }, 300);
}
function closeOpti() { document.getElementById('opti-modal').style.display='none'; if(previewLayer) previewLayer.clearLayers(); }
function resetSpiderfy() { spiderLines.forEach(layer => map.removeLayer(layer)); spiderLines = []; for (const [id, m] of Object.entries(markers)) { if (originalCoords[id]) { m.setLatLng(originalCoords[id]); m.setZIndexOffset(0); } } }
function checkAndSpreadStack(centerLat, centerLon, triggerId) {
    const stackIds = []; const threshold = 0.00005; 
    for (const [id, coord] of Object.entries(originalCoords)) { if (!markers[id]) continue; const latDiff = Math.abs(coord[0] - centerLat); const lonDiff = Math.abs(coord[1] - centerLon); if (latDiff < threshold && lonDiff < threshold) stackIds.push(id); }
    if (stackIds.length > 1) {
        let stackHtml = '<div class="stack-popup-content">'; stackHtml += '<h6>📍 ' + stackIds.length + ' Clients ici</h6><hr style="margin:5px 0">';
        stackIds.forEach(id => { const c = clients.find(client => String(client.id) === String(id)); if(c) { let prods = ''; c.produits.forEach(p => prods += `<span class="stack-prod">• ${p.qty} x ${p.title}</span>`); stackHtml += `<div class="stack-item"><strong>${c.nom}</strong>${prods}</div>`; } });
        stackHtml += '</div>';
        const anchorIcon = L.divIcon({ className: 'custom-anchor-wrapper', html: '<div class="anchor-pulse"></div>', iconSize: [12, 12], iconAnchor: [6, 6] });
        const centerMarker = L.marker([centerLat, centerLon], { icon: anchorIcon, zIndexOffset: -100 }).addTo(map);
        centerMarker.bindPopup(stackHtml, { maxWidth: 300 }); spiderLines.push(centerMarker);
        const angleStep = (2 * Math.PI) / stackIds.length; const radius = 0.0004; 
        stackIds.forEach((mid, index) => {
            const angle = index * angleStep; const newLat = centerLat + radius * Math.cos(angle); const newLon = centerLon + radius * Math.sin(angle) * 1.6; 
            if (markers[mid]) {
                markers[mid].setLatLng([newLat, newLon]); markers[mid].setZIndexOffset(1000); 
                const isSelected = (String(mid) === String(triggerId));
                const lineClass = isSelected ? 'spider-leg-active' : ''; const lineColor = isSelected ? '#e74c3c' : '#666'; const lineWeight = isSelected ? 3 : 2;
                const line = L.polyline([[centerLat, centerLon], [newLat, newLon]], { className: lineClass, color: lineColor, weight: lineWeight, dashArray: '4, 4', opacity: 0.7 }).addTo(map); spiderLines.push(line);
            }
        });
    }
}
function select(id, source = 'map') {
    if (id === null) return; let r = document.getElementById('row-' + id);
    if (!r) { document.getElementById('search-input').value = ''; filters = new Set(Object.keys(stats)); buildFilters(); refreshView(); updateBadge(); r = document.getElementById('row-' + id); }
    if (activeId && markers[activeId]) { const infoOld = markers[activeId].markerInfo; if (infoOld) { const iconHtml = `<div class="map-marker-content" style="background-color:${infoOld.color};">${infoOld.count}</div>`; markers[activeId].setIcon(L.divIcon({ html: iconHtml, className: 'custom-map-marker', iconSize: [30, 30], iconAnchor: [15, 15] })); } markers[activeId].closePopup(); const oldRow = document.getElementById('row-' + activeId); if (oldRow) oldRow.classList.remove('active'); }
    activeId = id; if (r) r.classList.add('active');
    resetSpiderfy();
    if (markers[id]) { const centerPos = originalCoords[id]; if (centerPos) checkAndSpreadStack(centerPos[0], centerPos[1], id); }
    const zoomToMarker = () => {
        if (!markers[id]) return; const info = markers[id].markerInfo;
        if (info) { const selectedIconHtml = `<div class="map-marker-content" style="background-color:${info.color}; border: 3px solid ${sysCol.selected}; width: 36px; height: 36px; font-size: 16px;">${info.count}</div>`; markers[id].setIcon(L.divIcon({ html: selectedIconHtml, className: 'custom-map-marker', iconSize: [36, 36], iconAnchor: [18, 18] })); }
        if (typeof markers[id].bringToFront === 'function') markers[id].bringToFront();
        map.flyTo(markers[id].getLatLng(), 18, { duration: 0.6, easeLinearity: 0.25 }); 
        map.once('moveend', () => { if (markers[id] && activeId === id) markers[id].openPopup(); });
    };
    zoomToMarker(); if (r) { r.scrollIntoView({ behavior: 'smooth', block: 'center' }); if (window.innerWidth <= 768) listPanel.style.height = '25%'; }
}
function toggleFilters() { const m=document.getElementById('filter-modal'); m.style.display=(m.style.display==='flex')?'none':'flex'; }
function updateBadge() {
    const badge = document.getElementById('active-count-badge'); if (!badge) return;
    const totalClients = clients.length; const activeFilters = filters.size;
    badge.textContent = `${visibleCount}/${totalClients}`;
    if (activeFilters === Object.keys(stats).length && visibleCount === totalClients) badge.style.backgroundColor = sysCol.default; else if (visibleCount === 0) badge.style.backgroundColor = '#b0bec5'; else badge.style.backgroundColor = sysCol.multi;
}
function buildFilters() {
    const c=document.getElementById('filter-list'); c.innerHTML='';
    let d=document.createElement('div'); d.className='filter-item-row bg-light fw-bold text-primary'; d.innerText='Tout Cocher / Décocher';
    d.onclick=()=>{ const all=document.querySelectorAll('.f-cb'); const act=filters.size===Object.keys(stats).length; if(act)filters.clear(); else filters=new Set(Object.keys(stats)); all.forEach(cb=>cb.checked=!act); refreshView(); updateBadge(); }; c.appendChild(d);
    Object.keys(stats).sort((a,b) => a.localeCompare(b)).forEach(k=>{

        let cb=document.createElement('input'); cb.type='checkbox'; cb.className='f-cb me-3'; cb.checked=filters.has(k); cb.style.transform='scale(1.3)';
        r.onclick=(e)=>{ if(e.target!==cb)cb.checked=!cb.checked; if(cb.checked)filters.add(k); else filters.delete(k); refreshView(); updateBadge(); };
        r.innerHTML+=`<div style="flex:1"><span class="prod-dot" style="background:${getCol(k)}"></span>${k}</div><span class="badge bg-secondary">${stats[k].qty_total}</span>`; r.prepend(cb); c.appendChild(r);
    });
}
